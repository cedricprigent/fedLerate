[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedlerate"
version = "0.1.0"
description = "Building blocks for federated learning systems."
readme = "README.md"
authors = [
  { name="Cédric Prigent", email="cedric.prigent@liris.cnrs.fr" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/cedricprigent/fedlerate"

[project.scripts]
fedlerate = "fedlerate.cli:main"